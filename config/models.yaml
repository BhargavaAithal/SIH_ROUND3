# SMITRACE Declarative Model Registry
# Define local open-weight models, capabilities, quantization, and hardware profiles
# New models can be added here without modifying or recompiling backend code.

version: "1.0"
models:
  # ==============================================================================
  # DECISION & ROUTING SPECIALISTS (Non-autoregressive System 1 intent routing & DAG dispatch)
  # ==============================================================================
  - model_id: "laya-modernbert-onnx"
    display_name: "Laya Decision Model (ModernBERT ONNX)"
    capabilities: ["decision", "routing", "classification", "intent_detection"]
    context_length: 8192
    quantization: "ONNX_FP16"
    hardware_vram_min_mb: 800
    endpoint: "in_process_onnx"
    priority: 110
    engine: "onnx_runtime"
    hardware_tiers: ["24gb", "48gb", "multi_gpu"]

  - model_id: "laya-mmbert-onnx"
    display_name: "Laya Multilingual Decision Model (mmBERT ONNX)"
    capabilities: ["decision", "routing", "classification", "multilingual_routing"]
    context_length: 8192
    quantization: "ONNX_FP16"
    hardware_vram_min_mb: 1100
    endpoint: "in_process_onnx"
    priority: 105
    engine: "onnx_runtime"
    hardware_tiers: ["24gb", "48gb", "multi_gpu"]

  - model_id: "laya-modernbert-http"
    display_name: "Laya Decision Model (Local HTTP Microservice)"
    capabilities: ["decision", "routing", "classification", "intent_detection"]
    context_length: 8192
    quantization: "ONNX_FP16"
    hardware_vram_min_mb: 800
    endpoint: "http://127.0.0.1:8005/v1"
    priority: 95
    engine: "http_rest"
    hardware_tiers: ["24gb", "48gb", "multi_gpu"]

  # ==============================================================================
  # CODING SPECIALISTS (Python / Rust scripts, sandboxed calculation execution)
  # ==============================================================================
  - model_id: "qwen-2.5-coder-32b-awq"
    display_name: "Qwen 2.5 Coder 32B (AWQ)"
    capabilities: ["coding", "numerical_script", "tool_use"]
    context_length: 32768
    quantization: "AWQ_4BIT"
    hardware_vram_min_mb: 18432
    endpoint: "http://127.0.0.1:8001/v1"
    priority: 100
    engine: "vllm"
    hardware_tiers: ["48gb", "multi_gpu"]

  - model_id: "qwen-2.5-coder-7b-gguf"
    display_name: "Qwen 2.5 Coder 7B (Q4_K_M)"
    capabilities: ["coding", "numerical_script", "tool_use"]
    context_length: 16384
    quantization: "GGUF_Q4_K_M"
    hardware_vram_min_mb: 6144
    endpoint: "http://127.0.0.1:8001/v1"
    priority: 80
    engine: "llama_cpp"
    hardware_tiers: ["24gb"]

  # ==============================================================================
  # REASONING & TASK PLANNING SPECIALISTS (Execution DAG generation, SMT formulation)
  # ==============================================================================
  - model_id: "llama-3.3-70b-instruct-q4"
    display_name: "Llama 3.3 70B Instruct (Q4_K_M)"
    capabilities: ["reasoning", "task_planning", "summarization"]
    context_length: 65536
    quantization: "GGUF_Q4_K_M"
    hardware_vram_min_mb: 40960
    endpoint: "http://127.0.0.1:8002/v1"
    priority: 95
    engine: "llama_cpp"
    hardware_tiers: ["48gb", "multi_gpu"]

  - model_id: "qwen-2.5-14b-instruct-awq"
    display_name: "Qwen 2.5 14B Instruct (AWQ)"
    capabilities: ["reasoning", "task_planning", "summarization"]
    context_length: 32768
    quantization: "AWQ_4BIT"
    hardware_vram_min_mb: 9728
    endpoint: "http://127.0.0.1:8002/v1"
    priority: 90
    engine: "vllm"
    hardware_tiers: ["24gb", "48gb", "multi_gpu"]

  - model_id: "gemma-2-9b-it-gguf"
    display_name: "Gemma 2 9B Instruct (Q4_K_M)"
    capabilities: ["reasoning", "task_planning", "summarization"]
    context_length: 8192
    quantization: "GGUF_Q4_K_M"
    hardware_vram_min_mb: 6656
    endpoint: "http://127.0.0.1:8002/v1"
    priority: 75
    engine: "llama_cpp"
    hardware_tiers: ["24gb"]


  # ==============================================================================
  # MULTIMODAL & VISION SPECIALISTS (Drawing inspection, field photos, layout)
  # ==============================================================================
  - model_id: "qwen2-vl-7b-instruct"
    display_name: "Qwen2-VL 7B Vision"
    capabilities: ["vision", "multimodal_reasoning", "drawing_inspection"]
    context_length: 16384
    quantization: "AWQ_4BIT"
    hardware_vram_min_mb: 6144
    endpoint: "http://127.0.0.1:8003/v1"
    priority: 90
    engine: "vllm"
    hardware_tiers: ["24gb", "48gb", "multi_gpu"]

  - model_id: "paddleocr-v4-onnx"
    display_name: "PaddleOCR v4 Layout & Table Engine"
