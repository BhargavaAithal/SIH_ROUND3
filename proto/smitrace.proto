syntax = "proto3";

package smitrace;

service WorkerService {
  // Z3 SMT Formal Verification
  rpc EvaluateZ3 (Z3Request) returns (Z3Response);
  
  // Vision Topology Extraction
  rpc ExtractVisionTopology (VisionRequest) returns (VisionResponse);
}

message Z3Request {
  string ast_script = 1;
}

message Z3Response {
  bool is_safe = 1;
  string constraint_proof = 2;
  double computed_value = 3;
}

message VisionRequest {
  bytes image_data = 1;
}

message VisionResponse {
  string graph_json = 1;
}
